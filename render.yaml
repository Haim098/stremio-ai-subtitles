services:
  - type: web
    name: stremio-ai-subtitles
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Secrets are never committed. Set GEMINI_API_KEY in the Render
      # dashboard (Environment tab); "sync: false" makes Render ask for it.
      - key: GEMINI_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
      # Set this in the Render dashboard (Environment tab). The server
      # still boots without it, but the SubDL source will be disabled.
      - key: SUBDL_API_KEY
        sync: false
